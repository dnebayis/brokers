name: indexer-schedule

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: testnet-indexer
  cancel-in-progress: false

jobs:
  update-and-poke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indexer
    env:
      NETWORK: testnet
      INDEXER_DATA_SOURCE: unusual_whales
      # Testnet's tokenizable universe is deliberately just five stocks, so route-ready
      # coverage of real Congress buying is always small; allow posting it anyway here.
      # Production keeps the default 0.70 gate.
      MIN_ROUTE_COVERAGE: "0"
      # Public chain-46630 staging registry (see ADDRESSES.md); baked in so only the
      # signing/API secrets below need configuring.
      STRATEGY_REGISTRY_ADDRESS: "0xd859b6ea10dd61604b55e8e86dc4a12c1e1f7ab3"
      # Required repository secrets:
      #   UNUSUAL_WHALES_API_KEY  — Congress disclosures source (or set FMP_API_KEY and
      #                             switch INDEXER_DATA_SOURCE to fmp/auto).
      #   TESTNET_ORACLE_PRIVATE_KEY — must equal the registry's on-chain oracleSigner.
      UNUSUAL_WHALES_API_KEY: ${{ secrets.UNUSUAL_WHALES_API_KEY }}
      UPDATER_PRIVATE_KEY: ${{ secrets.TESTNET_ORACLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: indexer/requirements.txt
      - run: pip install -r requirements.txt
      - run: python run.py --post --out latest-basket.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latest-indexer-basket
          path: indexer/latest-basket.json
