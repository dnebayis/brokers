name: mainnet-readiness

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      # `contracts/lib` is intentionally not versioned. Pin the exact libraries
      # used by this release so a clean GitHub runner resolves all remappings.
      - run: forge install foundry-rs/forge-std@467ffd422ca01fed5797a4c766a1e4e3a5327902
      - run: forge install OpenZeppelin/openzeppelin-contracts@v5.1.0
      - run: forge fmt --check
      - run: forge lint -D notes
      - run: forge test --no-match-path 'test/Fork*.t.sol'
      # RendererScale is executed by the normal test gate above. Its 1,776-item
      # payload loop exceeds Foundry coverage instrumentation's 10B gas ceiling.
      - run: forge coverage --ir-minimum --report lcov --report-file lcov.info --no-match-test 'test_allCanonicalPayloadsUploadAndRender'
      - run: python3 scripts/check_branch_coverage.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # WalletConnect brings platform-optional native packages whose complete
      # graph differs by runner OS; npm install resolves that graph on Linux.
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Mainnet placeholders must fail
        run: '! NEXT_PUBLIC_NETWORK=mainnet node scripts/validate-config.mjs'

  indexer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: indexer/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m py_compile *.py
      - run: python -m unittest discover -v
      - run: python run.py --sample

  art-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m py_compile *.py
      - run: python -m unittest discover -s . -p 'test_*.py' -v
      - run: python build_release_manifest.py
