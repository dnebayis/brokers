# Daily holder re-check: asks the site's recheck endpoint to re-read every verified
# wallet's Broker balance and strip the role from wallets that sold. Pages through
# the KV cursor until done. Needs the RECHECK_SECRET secret (same value as the
# Vercel env). Skips cleanly when the secret is unset.
name: discord-recheck

on:
  workflow_dispatch:
  schedule:
    - cron: "47 7 * * *"

permissions:
  contents: read

jobs:
  recheck:
    if: ${{ vars.DISCORD_RECHECK_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sweep verified holders
        env:
          SECRET: ${{ secrets.RECHECK_SECRET }}
        run: |
          set -euo pipefail
          cursor="0"
          for i in $(seq 1 50); do
            resp=$(curl -sS -H "Authorization: Bearer ${SECRET}" \
              "https://www.coattail.cash/api/discord/recheck?cursor=${cursor}")
            echo "$resp"
            cursor=$(echo "$resp" | jq -r '.cursor // "0"')
            ok=$(echo "$resp" | jq -r '.ok')
            [ "$ok" = "true" ] || exit 1
            [ "$cursor" = "0" ] && break
          done
