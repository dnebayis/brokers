# One-shot: registers the /verify slash command on the Discord application. Run once
# after creating the bot (and again only if the command set ever changes). Needs the
# DISCORD_APPLICATION_ID and DISCORD_BOT_TOKEN secrets.
name: discord-register-commands

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Register /verify
        env:
          APP_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bot ${BOT_TOKEN}" -H "Content-Type: application/json" \
            "https://discord.com/api/v10/applications/${APP_ID}/commands" \
            -d '[{"name":"verify","description":"Verify your Coattail Broker and get the holder role","type":1}]')
          echo "HTTP ${code}"
          cat /tmp/resp.json | head -c 2000
          [ "$code" = "200" ] || [ "$code" = "201" ]
