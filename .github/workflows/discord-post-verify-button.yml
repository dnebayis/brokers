# One-shot: posts the persistent "Verify your Broker" button message into the
# verification channel. The channel can then be locked for writing — the button keeps
# working (component interactions bypass Send Messages). The bot's role needs Send
# Messages / View Channel on that specific channel (grant it a channel override if the
# channel is locked for @everyone). Re-run only to re-post the message.
name: discord-post-verify-button

on:
  workflow_dispatch:
    inputs:
      channel_id:
        description: "Verification channel id"
        required: true

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      CHANNEL: ${{ github.event.inputs.channel_id }}
    steps:
      - name: Post button message
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bot ${BOT_TOKEN}" -H "Content-Type: application/json" \
            "https://discord.com/api/v10/channels/${CHANNEL}/messages" \
            -d '{
              "content": "**verify your broker**\nclick the button below — you get a private link only you can see.\nopen it, paste your wallet address, done. the Brokerage role lands automatically.\n\nno connecting. no signing. no approvals. ever.\nif anything asks you to connect a wallet or sign something during verification, it is not us — close it and ping a mod.",
              "components": [{
                "type": 1,
                "components": [{
                  "type": 2, "style": 1,
                  "label": "Verify your Broker",
                  "custom_id": "coattail_verify"
                }]
              }]
            }')
          echo "HTTP ${code}"
          head -c 500 /tmp/resp.json
          [ "$code" = "200" ]
