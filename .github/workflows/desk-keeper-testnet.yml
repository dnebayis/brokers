name: desk-keeper-testnet

# The Desk keeper on Robinhood Chain testnet (46630), against the audited deployment in
# desk/rehearsal/testnet-46630-v3.json. It buys deposits into the basket, rebalances on an
# epoch change, flushes fees to the Booster and keeps the four test price feeds fresh (the
# deposit router refuses ETH deposits on a feed older than 24h).
#
# Inert until switched on: set the repository VARIABLE DESK_TESTNET_KEEPER=1 and the SECRET
# DESK_TESTNET_KEEPER_KEY (the testnet-only keeper key; the owner sets it from their own
# terminal, it never appears in chat or in the repo).
#
# Same cadence as the Booster keeper and for the same reason: GitHub starts only a fraction
# of scheduled runs, so three slots fire every three hours and each run loops for five hours.
# One slot that lands covers past the next block; the concurrency group queues one run and
# drops the rest, so extra fires extend coverage instead of piling up.

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"
    - cron: "37 */3 * * *"
    - cron: "57 */3 * * *"

concurrency:
  group: desk-keeper-testnet
  cancel-in-progress: false

jobs:
  keep:
    if: ${{ vars.DESK_TESTNET_KEEPER == '1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 320
    env:
      RPC: https://rpc.testnet.chain.robinhood.com
      DESK_ADDRESSES: rehearsal/testnet-46630-v3.json
      KEEPER_KEY: ${{ secrets.DESK_TESTNET_KEEPER_KEY }}
      # five hours of 20-second ticks; a quiet tick is reads only
      RUN_SECONDS: "18000"
      EVERY: "20"
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      # the keeper reads its ABIs from desk/out, built against the same pinned libraries as CI
      - run: forge install foundry-rs/forge-std@467ffd422ca01fed5797a4c766a1e4e3a5327902
        working-directory: contracts
      - run: forge install OpenZeppelin/openzeppelin-contracts@v5.1.0
        working-directory: contracts
      - run: forge build
        working-directory: desk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: indexer/requirements.txt
      - run: pip install -r indexer/requirements.txt
      - name: Keep the Desks on the basket
        working-directory: desk
        run: python -u keeper/desk_keeper.py
