name: keeper-schedule-mainnet

# Mainnet Booster keeper. Pre-staged and inert: every job is guarded on the mainnet address
# variables, so scheduled runs cleanly skip until the owner sets them post-deploy. To activate
# after the mainnet launch, set the repository VARIABLES (Settings → Secrets and variables →
# Actions → Variables): MAINNET_BROKER_ADDRESS, MAINNET_BOOSTER_ADDRESS, MAINNET_HOOK_ADDRESS,
# MAINNET_FEE_SPLITTER_ADDRESS, MAINNET_BUYBACK_BURNER_ADDRESS, MAINNET_BROKER_DEPLOYMENT_BLOCK.
# The keeper key reuses the existing TESTNET_KEEPER_PRIVATE_KEY secret (shared-key launch, the
# owner's accepted-risk decision) — no new secret needed. The Alchemy mainnet RPC (secret
# RH_MAINNET_RPC_URL) is Origin-allowlisted; RH_RPC_ORIGIN adds that header.

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    # SPARSE cron, hourly work. Measured 2026-08-27..29: of the 48 hourly slots this
    # workflow asked for each day, GitHub actually started 2 or 3. Every scheduled
    # workflow in the repo collapsed the same way on the same day, so the cause is the
    # scheduler deprioritising a repo that asks for ~400 scheduled runs a day, not this
    # job. Asking less often is therefore the fix, not asking more often: the cron now
    # fires every three hours and the run does its own hourly loop inside (see below), so
    # one slot that lands covers a full three-hour window instead of a single minute.
    # Three slots per block, and the run loops for FIVE hours rather than three. That
    # slack is the point: measured 2026-08-29, GitHub dropped an entire three-hour block
    # across every scheduled workflow in the repo at once, which with exactly-three-hour
    # coverage left a real hole with nothing queued behind it. At five hours, one slot
    # that lands covers past the whole of the next block, so coverage survives a dropped
    # block instead of ending with it. Extra fires are not waste: the concurrency group
    # queues one and drops the rest, so they extend coverage rather than pile up.
    - cron: "11 */3 * * *"
    - cron: "31 */3 * * *"
    - cron: "51 */3 * * *"

concurrency:
  group: mainnet-booster-keeper
  cancel-in-progress: false

jobs:
  poke-if-eligible:
    # Inert until the mainnet Broker address variable is set post-deploy.
    if: ${{ vars.MAINNET_BROKER_ADDRESS != '' }}
    runs-on: ubuntu-latest
    # Five hourly passes plus slack. The job spends almost all of it asleep.
    timeout-minutes: 320
    defaults:
      run:
        working-directory: indexer
    env:
      NETWORK: mainnet
      RH_RPC_URL: ${{ secrets.RH_MAINNET_RPC_URL }}
      RH_RPC_ORIGIN: ${{ vars.RH_RPC_ORIGIN }}
      BROKER_ADDRESS: ${{ vars.MAINNET_BROKER_ADDRESS }}
      BOOSTER_ADDRESS: ${{ vars.MAINNET_BOOSTER_ADDRESS }}
      HOOK_ADDRESS: ${{ vars.MAINNET_HOOK_ADDRESS }}
      FEE_SPLITTER_ADDRESS: ${{ vars.MAINNET_FEE_SPLITTER_ADDRESS }}
      BUYBACK_BURNER_ADDRESS: ${{ vars.MAINNET_BUYBACK_BURNER_ADDRESS }}
      BROKER_DEPLOYMENT_BLOCK: ${{ vars.MAINNET_BROKER_DEPLOYMENT_BLOCK }}
      # Quoted so GitHub passes the literal string, not a float rendered as "1E+15".
      BUYBACK_THRESHOLD_WEI: "1000000000000000"
      # Production runs strict: a deferred poke / stale feed fails loudly instead of warning.
      KEEPER_STRICT: "1"
      # Reuses the existing keeper key (shared-key launch, accepted-risk decision).
      KEEPER_PRIVATE_KEY: ${{ secrets.TESTNET_KEEPER_PRIVATE_KEY }}
      # The Floor fee flush (stage is inert while this secret is empty).
      FLOOR_ROUTER: ${{ secrets.FLOOR_ROUTER }}
      # Playbooks standing-order execution (same env-gating: empty secret = inert stage).
      PLAYBOOKS_ENGINE: ${{ secrets.PLAYBOOKS_ENGINE }}
      # A playbook run costs ~1M gas, so an order waits until the Broker's wallet is worth
      # moving. The wait skips the order's claim step too, so a below-threshold Broker is
      # claimed by the weekly ClaimSweeper pass or by the holder in one click, same as a
      # Broker with no playbook. Earnings accrue in the Booster until claimed either way.
      PLAYBOOKS_MIN_USDG: "5"
      # Every enrolled Broker is valued on every pass (reads only, four multicalls), so an
      # order runs on the first hourly pass after it clears the threshold instead of
      # waiting for a 200-wide window to rotate around to it.
      PLAYBOOKS_MAX_SCAN: "2000"
      # Optional Discord channel webhook for operator alerts (low relay gas, fatal
      # stage deferrals). Unset -> alerts are silent no-ops.
      OPS_WEBHOOK_URL: ${{ secrets.OPS_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: indexer/requirements.txt
      - run: pip install -r requirements.txt
      - name: Check threshold and poke the last valid basket
        # Five passes an hour apart. The keeper is idempotent and sends no transaction
        # when there is nothing to do, so a pass that lands on a quiet hour costs reads.
        # Only the LAST pass decides the job's exit status: an early pass that hits a
        # flaky RPC is retried by the next one, and failing the whole job for it would
        # cry wolf. A pass that fails is still printed and annotated.
        run: |
          set -uo pipefail
          passes=5
          fail=0
          for i in $(seq 1 "$passes"); do
            if [ "$i" -gt 1 ]; then sleep 3600; fi
            echo "::group::keeper pass ${i}/${passes}"
            if python keeper.py --execute; then
              fail=0
            else
              fail=1
              echo "::warning::keeper pass ${i}/${passes} failed; the next pass retries"
            fi
            echo "::endgroup::"
          done
          exit "$fail"
      # Claim distribution moved to claim-distribution-mainnet.yml (weekly, via
      # ClaimSweeper 40-NFT sweeps). Hourly 5-NFT pushes were ~90% of the keeper
      # wallet's gas; rewards accrue safely in the Booster until claimed either way.
