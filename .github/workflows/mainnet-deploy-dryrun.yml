name: mainnet-deploy-dryrun

# Simulates the Phase 1 critical-infrastructure deploy (Deploy.s.sol) against live RH
# mainnet state, WITHOUT --broadcast — it spends nothing and touches no production key.
# A freshly generated throwaway deployer with ALLOW_DEPLOYER_OWNER=true exercises the
# chain-4663 mainnet code path (canonical-dependency probe, shared-key gate, wiring
# asserts) so the deploy script is proven against real state before the owner broadcasts.
# The token launch (LaunchWithHook / Phase 2) is separately fork-proven by ForkLaunch and
# ForkFullSystem in mainnet-fork-release.yml.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    env:
      RH_UPSTREAM_RPC: ${{ secrets.RH_MAINNET_RPC_URL }}
      # The mainnet Alchemy endpoint is allowlisted to the coattail.cash Origin; the proxy
      # adds that header so Foundry's fork client (which cannot) can reach the archive RPC.
      RH_RPC_ORIGIN: ${{ vars.RH_RPC_ORIGIN }}
      RH_PROXY_PORT: "18545"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      # contracts/lib is not versioned; pin the exact libraries like ci.yml does.
      - run: forge install foundry-rs/forge-std@467ffd422ca01fed5797a4c766a1e4e3a5327902
      - run: forge install OpenZeppelin/openzeppelin-contracts@v5.1.0
      - name: Start the Origin proxy to the archive RPC
        run: |
          nohup python3 scripts/rpc_origin_proxy.py > /tmp/rpc_proxy.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf -X POST http://127.0.0.1:18545 -H 'Content-Type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' && break
            sleep 1
          done
      - name: Dry-run the Phase 1 deploy against the mainnet fork
        run: |
          # Throwaway deployer — a simulation resolves CREATE addresses from its nonce; no
          # production key is used and nothing is broadcast. Shared-key path is opted in.
          PK=$(cast wallet new | awk '/Private key:/ {print $3}')
          DEP=$(cast wallet address "$PK")
          echo "dry-run deployer (throwaway): $DEP"
          PRIVATE_KEY="$PK" \
          OWNER="$DEP" TREASURY="$DEP" CREATOR="$DEP" BUYBACK="$DEP" \
          UPDATER="$DEP" ORACLE_SIGNER="$DEP" \
          ALLOW_DEPLOYER_OWNER=true \
          forge script script/Deploy.s.sol:Deploy \
            --fork-url http://127.0.0.1:18545 --fork-retries 12 -vv
      - name: Confirm the mainnet guard rejects a shared key without the opt-in
        run: |
          # Negative check: the same shared-key config MUST revert when ALLOW_DEPLOYER_OWNER
          # is not set, proving the role-separation guard is live on the mainnet path.
          PK=$(cast wallet new | awk '/Private key:/ {print $3}')
          DEP=$(cast wallet address "$PK")
          if PRIVATE_KEY="$PK" \
             OWNER="$DEP" TREASURY="$DEP" CREATOR="$DEP" BUYBACK="$DEP" \
             UPDATER="$DEP" ORACLE_SIGNER="$DEP" \
             forge script script/Deploy.s.sol:Deploy \
               --fork-url http://127.0.0.1:18545 --fork-retries 12 > /tmp/guard.log 2>&1; then
            echo "::error::deploy did not revert on a shared key without ALLOW_DEPLOYER_OWNER"
            cat /tmp/guard.log
            exit 1
          fi
          grep -q "deployer fallback" /tmp/guard.log \
            && echo "guard confirmed: shared key rejected without the opt-in" \
            || { echo "::error::reverted for the wrong reason"; cat /tmp/guard.log; exit 1; }
