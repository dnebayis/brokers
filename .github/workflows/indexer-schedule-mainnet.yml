name: indexer-schedule-mainnet

# Mainnet Congress indexer — hourly. Pre-staged and inert: guarded on the mainnet registry variable, so
# scheduled runs cleanly skip until the owner sets it post-deploy. To activate after launch, set
# the repository VARIABLE MAINNET_STRATEGY_REGISTRY_ADDRESS. The oracle key reuses the existing
# TESTNET_ORACLE_PRIVATE_KEY secret (shared-key launch, accepted-risk decision) and must equal the
# mainnet registry's on-chain oracleSigner. Reuses the shared UNUSUAL_WHALES_API_KEY secret and the
# Origin-allowlisted Alchemy RPC (RH_MAINNET_RPC_URL). Coverage floor is 0.40 (MIN_ROUTE_COVERAGE
# repo variable) — below it, run.py retains the previous epoch and skips the post as a clean no-op.

permissions:
  # write: the run publishes latest-basket.json to the `data` branch for the site
  contents: write

on:
  workflow_dispatch:
  schedule:
    # Hourly, offset from the keeper (minute 11) so the two never hit the RPC together.
    # Posting is a no-op when the basket is unchanged, so hourly runs cost no extra oracle
    # gas — they only catch a new disclosure within the hour instead of within six
    # (roadmap phase 02, "an earlier signal").
    # Sparse cron, hourly work: GitHub started 1-3 of this workflow's 24 daily slots
    # between 2026-08-27 and 2026-08-29. The cron fires every three hours now and the run
    # loops hourly inside, so a slot that lands covers three hours instead of one minute.
    - cron: "37 */3 * * *"
    - cron: "57 */3 * * *"

# Scheduled runs loop for five hours; a dispatched run (the earlier-signal poll, or an
# operator) is a single pass that must start NOW, not queue behind that loop and then be
# cancelled by the next cron slot (GitHub keeps one pending run per group). So the two
# event kinds get their own groups. Two runs may then overlap for a few minutes, which is
# safe: run.py re-reads the on-chain basket right before signing and posting an
# unchanged basket is a no-op, so the worst case is one redundant read.
concurrency:
  group: mainnet-indexer-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  update-and-poke:
    if: ${{ vars.MAINNET_STRATEGY_REGISTRY_ADDRESS != '' }}
    runs-on: ubuntu-latest
    # Five hourly passes plus slack; the job is asleep for almost all of it.
    timeout-minutes: 320
    defaults:
      run:
        working-directory: indexer
    env:
      NETWORK: mainnet
      INDEXER_DATA_SOURCE: unusual_whales
      RH_RPC_URL: ${{ secrets.RH_MAINNET_RPC_URL }}
      RH_RPC_ORIGIN: ${{ vars.RH_RPC_ORIGIN }}
      STRATEGY_REGISTRY_ADDRESS: ${{ vars.MAINNET_STRATEGY_REGISTRY_ADDRESS }}
      # Enables the live route pre-flight: run.py reads the StockRouter off this Booster
      # and eth_call-simulates every basket leg before signing, dropping any route whose
      # pool cannot fill today. Without it one illiquid pool reverts the whole atomic poke.
      BOOSTER_ADDRESS: ${{ vars.MAINNET_BOOSTER_ADDRESS || '0x7bAf435847A4b45c2e22a7fd13549C3192C95953' }}
      # Low tokenizable coverage is a normal wait-state, not a failure: run.py keeps the previous
      # epoch and skips the post cleanly (green). Real anomalies (snapshot health, sample data)
      # still hard-fail regardless of strict. The coverage floor reflects RH Chain's tokenized
      # universe. The gate is NOT a representativeness claim: coverage is structurally low
      # because this chain has tokenized a minority of what Congress buys, and the single
      # largest missed name has no pool or feed here at all. Holding the gate high only
      # froze the basket at a stale epoch, which is worse than tracking the tradable set
      # and publishing the gap. It is now a sanity floor against degenerate data; the
      # honest number is disclosed in the docs and in every run's output.
      MIN_ROUTE_COVERAGE: ${{ vars.MIN_ROUTE_COVERAGE || '0.40' }}
      UNUSUAL_WHALES_API_KEY: ${{ secrets.UNUSUAL_WHALES_API_KEY }}
      # Reuses the existing oracle key (shared-key launch, accepted-risk decision).
      UPDATER_PRIVATE_KEY: ${{ secrets.TESTNET_ORACLE_PRIVATE_KEY }}
      # Optional Discord channel webhook for operator alerts (health FAIL, preflight
      # drops, UW page-cap truncation). Unset -> alerts are silent no-ops.
      OPS_WEBHOOK_URL: ${{ secrets.OPS_WEBHOOK_URL }}
      # Shadow-vs-live divergence series, appended every scheduled pass and persisted
      # across runs via the actions cache below — the SMART_BASKET=live decision reads
      # this file. Dispatched single-pass runs do not touch it: two runs restoring and
      # re-saving the same cache would overwrite each other's appends.
      SHADOW_HISTORY_FILE: ${{ github.event_name == 'schedule' && 'shadow-history.mainnet.jsonl' || '' }}
      # Basket note (attribution is always computed; the note needs the model key and is
      # regenerated only when the facts change). Unset key -> note absent, nothing else changes.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
      # A note is rewritten at most once per this many hours, and only when the facts changed.
      NOTE_MIN_HOURS: ${{ vars.NOTE_MIN_HOURS || '5' }}
      BASKET_DATA_URL: https://raw.githubusercontent.com/${{ github.repository }}/data/basket-latest.json
      # Scorecard (engine cost vs live price per name), incremental over the published copy.
      SCORECARD_DATA_URL: https://raw.githubusercontent.com/${{ github.repository }}/data/basket-scorecard.json
      # Shadow-vs-live series, published so the scorecard can price the smart basket per hour.
      SHADOW_DATA_URL: https://raw.githubusercontent.com/${{ github.repository }}/data/shadow-history.jsonl
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # Restore the newest previous shadow history (unique key per run + prefix restore:
      # the post-job save always succeeds, and the next run picks up the latest).
      - uses: actions/cache@v4
        if: github.event_name == 'schedule'
        with:
          path: indexer/shadow-history.mainnet.jsonl
          key: shadow-history-mainnet-${{ github.run_id }}
          restore-keys: |
            shadow-history-mainnet-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: indexer/requirements.txt
      - run: pip install -r requirements.txt
      - name: Rebuild and post the basket (hourly passes; a dispatch is one pass)
        # Posting an unchanged basket is already a no-op on chain, so extra passes cost
        # reads, not gas. Only the last pass sets the exit status; the artifacts uploaded
        # below are that last pass's output, and the shadow history appends every pass.
        run: |
          set -uo pipefail
          passes=5
          [ "${{ github.event_name }}" = "schedule" ] || passes=1
          fail=0
          for i in $(seq 1 "$passes"); do
            if [ "$i" -gt 1 ]; then sleep 3600; fi
            echo "::group::indexer pass ${i}/${passes}"
            if python run.py --post --out latest-basket.json; then
              fail=0
              # the site reads this file; publish every pass so the feed is at most an hour old
              bash ../scripts/publish_data.sh latest-basket.json basket-latest.json || echo "::warning::data publish failed"
              bash ../scripts/publish_data.sh feed-30d.json feed-30d.json || echo "::warning::feed publish failed"
              bash ../scripts/publish_data.sh members.json members.json || echo "::warning::members publish failed"
              if [ -n "${SHADOW_HISTORY_FILE:-}" ] && [ -f "$SHADOW_HISTORY_FILE" ]; then
                bash ../scripts/publish_data.sh "$SHADOW_HISTORY_FILE" shadow-history.jsonl || echo "::warning::shadow publish failed"
              fi
              if python scorecard.py --out scorecard.json; then
                bash ../scripts/publish_data.sh scorecard.json basket-scorecard.json || echo "::warning::scorecard publish failed"
              else
                echo "::warning::scorecard build failed; the published copy stays"
              fi
            else
              fail=1
              echo "::warning::indexer pass ${i}/${passes} failed; the next pass retries"
            fi
            echo "::endgroup::"
          done
          exit "$fail"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latest-indexer-basket-mainnet
          path: indexer/latest-basket.json
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'schedule'
        with:
          name: shadow-history-mainnet
          path: indexer/shadow-history.mainnet.jsonl
          if-no-files-found: ignore
