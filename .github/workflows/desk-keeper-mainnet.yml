name: desk-keeper-mainnet

# The Desk keeper on Robinhood Chain mainnet (4663), against desk/rehearsal/mainnet-4663.json
# (written by script/DeployDeskMainnet.s.sol and committed after the deploy). It buys deposits
# into the live basket, trades only the difference on an epoch change and flushes the service
# fees to the Booster as ETH. Mainnet feeds are real Chainlink feeds, so there is nothing to
# refresh.
#
# Inert until switched on: set the repository VARIABLE DESK_MAINNET_KEEPER=1. The Desk shares the
# Booster's keeper relay (user decision 2026-10-07), so it signs with the same existing secret,
# TESTNET_KEEPER_PRIVATE_KEY; both keepers take the nonce as max(pending, latest) so they do not
# trip over each other. Reads go through the metered endpoint (secret RH_MAINNET_RPC_URL,
# Origin-allowlisted via the RH_RPC_ORIGIN variable), the same as the Booster keeper.
#
# Cadence as the Booster keeper: three cron slots every three hours, five-hour runs, one run
# queued per group, so a dropped scheduler block does not leave a gap.

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "7 */3 * * *"
    - cron: "27 */3 * * *"
    - cron: "47 */3 * * *"

concurrency:
  group: desk-keeper-mainnet
  cancel-in-progress: false

jobs:
  keep:
    if: ${{ vars.DESK_MAINNET_KEEPER == '1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 320
    env:
      RPC: ${{ secrets.RH_MAINNET_RPC_URL }}
      RPC_ORIGIN: ${{ vars.RH_RPC_ORIGIN }}
      DESK_ADDRESSES: rehearsal/mainnet-4663.json
      KEEPER_KEY: ${{ secrets.TESTNET_KEEPER_PRIVATE_KEY }}
      # five hours of 30-second ticks; a quiet tick is one multicall plus the basket reads
      RUN_SECONDS: "18000"
      EVERY: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      # the keeper reads its ABIs from desk/out, built against the same pinned libraries as CI
      - run: forge install foundry-rs/forge-std@467ffd422ca01fed5797a4c766a1e4e3a5327902
        working-directory: contracts
      - run: forge install OpenZeppelin/openzeppelin-contracts@v5.1.0
        working-directory: contracts
      - run: forge build
        working-directory: desk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: indexer/requirements.txt
      - run: pip install -r indexer/requirements.txt
      - name: Keep the Desks on the basket
        working-directory: desk
        run: python -u keeper/desk_keeper.py
