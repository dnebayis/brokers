name: keeper-schedule

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "11 * * * *"

concurrency:
  group: testnet-booster-keeper
  cancel-in-progress: false

jobs:
  poke-if-eligible:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: indexer
    env:
      NETWORK: testnet
      BROKER_ADDRESS: ${{ vars.TESTNET_BROKER_ADDRESS }}
      BOOSTER_ADDRESS: ${{ vars.TESTNET_BOOSTER_ADDRESS }}
      HOOK_ADDRESS: ${{ vars.TESTNET_HOOK_ADDRESS }}
      FEE_SPLITTER_ADDRESS: ${{ vars.TESTNET_FEE_SPLITTER_ADDRESS }}
      BUYBACK_BURNER_ADDRESS: ${{ vars.TESTNET_BUYBACK_BURNER_ADDRESS }}
      BUYBACK_THRESHOLD_WEI: 1000000000000000
      KEEPER_PRIVATE_KEY: ${{ secrets.TESTNET_KEEPER_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: indexer/requirements.txt
      - run: pip install -r requirements.txt
      - name: Check threshold and poke the last valid basket
        run: python keeper.py --execute
      - name: Claim resumable five-NFT batches to TBAs
        run: python claim_distributor.py --execute --max-batches 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testnet-claim-state
          path: indexer/claim-state.testnet.json
