name: keeper-schedule

permissions:
  contents: read

on:
  workflow_dispatch:
  # Testnet schedule retired after mainnet launch — dispatch-only now.
  # schedule:
  #   - cron: (retired)

concurrency:
  group: testnet-booster-keeper
  cancel-in-progress: false

jobs:
  poke-if-eligible:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: indexer
    env:
      NETWORK: testnet
      # Public chain-46630 staging addresses (see ADDRESSES.md / frontend/deployments.json).
      # Baked in so the only thing to configure is the keeper signing secret below.
      BROKER_ADDRESS: "0x1f6e75a3add9c7debc8594d4f41fa557fc33ddaf"
      BOOSTER_ADDRESS: "0x39e4b20401dc4ca45c0b14800c86fc3df953a245"
      HOOK_ADDRESS: "0xabc22a662a1bf11f6306ba192ce33acef31d2044"
      FEE_SPLITTER_ADDRESS: "0xc1250d95ee696c52ddc2636a74edab5cf32107d7"
      BUYBACK_BURNER_ADDRESS: "0xf6afc4614adff1aedb04d0d374ec4d0d3bbe6964"
      # Quoted so GitHub passes the literal string, not a float rendered as "1E+15".
      BUYBACK_THRESHOLD_WEI: "1000000000000000"
      # Required repository secret: a gas-funded testnet key with no on-chain role.
      KEEPER_PRIVATE_KEY: ${{ secrets.TESTNET_KEEPER_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: indexer/requirements.txt
      - run: pip install -r requirements.txt
      - name: Check threshold and poke the last valid basket
        run: python keeper.py --execute
      - name: Claim resumable five-NFT batches to TBAs
        run: python claim_distributor.py --execute --max-batches 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testnet-claim-state
          path: indexer/claim-state.testnet.json
