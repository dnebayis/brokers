[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["../contracts/lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=../contracts/lib/openzeppelin-contracts/contracts/",
    "forge-std/=../contracts/lib/forge-std/src/",
]
fs_permissions = [
    { access = "read", path = "../indexer/route-ready.mainnet.json" },
    { access = "read-write", path = "./rehearsal" },
]

[fmt]
line_length = 110
