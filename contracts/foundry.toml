[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# The renderer scale harness models 356 separate five-token transactions inside one test call.
# Production transactions remain batch-capped; this larger local limit is test-harness-only.
gas_limit = 10000000000
fs_permissions = [
    { access = "read-write", path = "./" },
    { access = "read", path = "../pipeline/collection" },
]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fmt]
line_length = 110

[lint]
# Tests intentionally model signed Uniswap deltas and use mock ERC-20s. Production source and
# deployment scripts remain linted; stable public ABI/getter names are excluded from style-only
# renaming rules so a lint cleanup cannot silently break integrations.
ignore = ["test/*"]
exclude_lints = [
    "asm-keccak256",
    "mixed-case-function",
    "screaming-snake-case-immutable",
]
